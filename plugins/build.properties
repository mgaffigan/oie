# Shared properties for plugin builds
# Paths are relative to the individual plugin directory (e.g., plugins/dicom/)
# Plugin builds must set 'plugin.dir' before loading this file

# Server paths (relative from plugin dir)
server.dir=${plugin.dir}/../../server
server.src=${server.dir}/src
server.classes=${server.dir}/classes
server.lib=${server.dir}/lib
server.lib.extensions=${server.lib}/extensions
server.build=${server.dir}/build
server.extensions=${server.build}/extensions
server.dist=${server.dir}/dist
server.dist.extensions=${server.dist}/extensions
version=4.5.2
