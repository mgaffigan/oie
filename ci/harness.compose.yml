# Overlay that adds the smoke-test harness to any configuration under
# ci/configurations.
services:
  harness:
    image: oie-ci-harness:local
    depends_on:
      oie:
        condition: service_healthy
    # Tests are run with the UID/GID of the host so we don't have permission issues
    user: "${HOST_UID}:${HOST_GID}"
    environment:
      HOME: /tmp
      OIE_BASE_URL: https://oie:8443
      OIE_CONFIGURATION: ${OIE_CONFIGURATION}
    volumes:
      - ${WORKSPACE}/ci/test-results:/results
