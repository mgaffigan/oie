services:
  oie:
    image: ${OIE_IMAGE}
    environment:
      DATABASE: derby
      DATABASE_URL: "jdbc:derby:$${dir.appdata}/mirthdb;create=true"
    ports:
      - "8443:8443"
    healthcheck:
      test:
        - CMD-SHELL
        - bash -lc 'exec 3<>/dev/tcp/127.0.0.1/8443'
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 40s
