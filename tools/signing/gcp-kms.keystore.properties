# Jar signing against the code-signing key in Google Cloud KMS, via jsign's
# JCA provider. Passed to the build with -Pkeystore_property_file; see
# README.md in this directory.
#
# Nothing here is secret: the key never leaves the HSM, and access is granted
# by the caller's Google Cloud credentials.

cert=ca
key.storetype=GOOGLECLOUD
key.providerclass=net.jsign.jca.JsignJcaProvider

# The key ring, not the key. jsign requires exactly this shape.
key.providerarg=projects/itt-misc/locations/us/keyRings/itt
key.keystore=NONE

# <key>/cryptoKeyVersions/<n>:<algorithm family>. The ":RSA" suffix tells jsign
# the key algorithm directly; without it jsign tries to infer it from a
# certificate its JCA provider cannot supply, and signing fails with
# "Failed to load the certificate from".
key.alias=itt-2026-ev/cryptoKeyVersions/1:RSA

# Relative to the repository root.
key.certchain=tools/signing/oie-codesign-chain.pem

# Any trusted RFC 3161 authority will do; it need not be the issuing CA.
# DigiCert answers in ~1s where Sectigo takes ~5s, and the timestamp is the
# whole cost of signing a jar -- over ~220 jars that is minutes, not an hour.
signingTsa=http://timestamp.digicert.com

# Supplied on the command line, because both are caller-specific:
#   key.storepass       a short-lived OAuth access token
#   key.jarsignerargs   -J-cp -J<path to jsign jar> -J--add-modules -Jjava.sql

# The legacy TLS workarounds in signSetupJars disable SNI, which makes the
# Cloud KMS endpoint answer with a default certificate that fails PKIX.
key.legacyTls=false
